[package]
name = "tender-analysis-desktop"
version = "0.1.0"
description = "投标分析 Agent 桌面工作台"
authors = ["Tender Analysis Contributors"]
edition = "2021"

[lib]
name = "tender_analysis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
